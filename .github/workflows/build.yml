name: Build libreforge

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - "**/*.kt"
      - "**/*.java"
      - "**/*.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"

  pull_request:
    branches:
      - master
    paths:
      - "**/*.kt"
      - "**/*.java"
      - "**/*.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"

permissions:
  contents: read

jobs:
  build:
    name: Build libreforge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show versions
        run: |
          java -version
          ./gradlew --version
          echo "Configured versions:"
          grep -E "^(version|eco-version)[[:space:]]*=" gradle.properties || true

      - name: Build libreforge
        run: |
          ./gradlew clean build --full-stacktrace --no-daemon

      - name: List generated JAR files
        run: |
          echo "Generated JAR files:"
          find . -type f -path "*/build/libs/*.jar" -print -exec ls -lh {} \;

      - name: Upload libreforge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libreforge-2026.30-build-${{ github.run_number }}
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
